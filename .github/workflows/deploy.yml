# ============================================================
# 本番自動デプロイ（案B: プルリクのマージ＝公開）
#
#   プルリク作成・更新 → 検品(check.sh) ＋ 転送の予行演習(dry-run)。本番は変わらない
#   main へのマージ     → 検品 → 本番へ転送 → 本番URLと実測照合
#
# 安全装置:
#   - 転送先は下の DEPLOY_PATH に固定。/lp/<事業部>/<LP名>/ の形以外なら止まる
#   - 転送するのは index.html と assets/ だけ（include 方式。scripts/ や README は上がらない）
#   - 削除同期(--delete)はしない。サーバー側で不要になったファイルは手動で片付ける
#   - リポジトリ変数 DEPLOY_ENABLED が 'true' でない間は、マージしても dry-run 止まり
# ============================================================
name: deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: www1151.onamae.ne.jp
  DEPLOY_PORT: "8022"
  DEPLOY_USER: r1300591
  DEPLOY_PATH: /home/r1300591/public_html/reflame.co.jp/lp/newgrads/justdoito/
  LIVE_URL: https://reflame.co.jp/lp/newgrads/justdoito/

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 検品（preflight 相当）
        run: bash scripts/check.sh .

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 実行モードの決定
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ vars.DEPLOY_ENABLED }}" = "true" ]; then
            echo "dry=" >> "$GITHUB_OUTPUT"; echo "▶ 本番転送モード"
          else
            echo "dry=--dry-run" >> "$GITHUB_OUTPUT"; echo "▶ 予行演習モード（本番は変わらない）"
          fi

      - name: 転送先の検査
        run: |
          case "$DEPLOY_PATH" in
            /home/r1300591/public_html/reflame.co.jp/lp/*/*/) echo "✓ 転送先: $DEPLOY_PATH" ;;
            *) echo "🛑 転送先が想定外の形: $DEPLOY_PATH"; exit 1 ;;
          esac

      - name: SSH の準備
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [ -n "$SSH_KEY" ] || { echo "🛑 Secret DEPLOY_SSH_KEY が未登録"; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "🛑 Secret DEPLOY_KNOWN_HOSTS が未登録"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -d '$DEPLOY_PATH'" || { echo "🛑 サーバーに転送先フォルダが無い（LP名の誤り？）"; exit 1; }
          echo "✓ SSH接続・転送先フォルダの実在を確認"

      - name: 転送（rsync）
        run: |
          rsync -rltvzc --itemize-changes ${{ steps.mode.outputs.dry }} \
            --chmod=D755,F644 \
            --include='index.html' --include='assets/***' --exclude='*' \
            -e "ssh -i $HOME/.ssh/deploy_key -p $DEPLOY_PORT -o BatchMode=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

      - name: 本番URLと実測照合
        if: steps.mode.outputs.dry == ''
        run: |
          want=$(sha256sum index.html | cut -d' ' -f1)
          for i in 1 2 3; do
            got=$(curl -fsS -H 'Cache-Control: no-cache' "${LIVE_URL}?v=${GITHUB_SHA}" | sha256sum | cut -d' ' -f1)
            [ "$got" = "$want" ] && { echo "✓ 本番の index.html がリポジトリと一致"; break; }
            echo "…不一致（$i/3）。10秒後に再確認"; sleep 10
          done
          [ "$got" = "$want" ] || { echo "🛑 本番の index.html がリポジトリと一致しない"; exit 1; }
          fail=0
          for f in assets/*; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${LIVE_URL}${f}")
            [ "$code" = "200" ] || { echo "🛑 $f → HTTP $code"; fail=1; }
          done
          [ $fail -eq 0 ] && echo "✓ assets 全て HTTP 200" || exit 1
